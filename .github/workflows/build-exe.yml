name: Construir ejecutable de Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Buscador-de-assets
          path: release/Buscador-de-assets.exe
      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" release/Buscador-de-assets.exe --title "Buscador de assets v1.0.${{ github.run_number }}" --notes "Descarga el .exe y haz doble clic."
